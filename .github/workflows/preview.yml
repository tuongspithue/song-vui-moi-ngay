name: xem-thu-ban-moi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: reel/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji
      - run: pip install -r reel/requirements.txt
      - name: Dựng 3 video xem thử (không đăng)
        env: { WORK_DIR: /tmp/svmn }
        run: |
          KIND=meo COUNTER=5 RID=R122 python reel/show.py
          KIND=odd COUNTER=1 python reel/show.py
          KIND=emoji COUNTER=0 python reel/show.py
      - name: Lưu vào nhánh preview
        run: |
          mkdir out && cp /tmp/svmn/meo.mp4 /tmp/svmn/odd.mp4 /tmp/svmn/emoji.mp4 /tmp/svmn/*_caption.txt out/ && cd out
          git init -q && git checkout -q -b preview
          git config user.name "tuongspithue" && git config user.email "tuongspithue@users.noreply.github.com"
          git add . && git commit -q -m "video xem thử"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview
