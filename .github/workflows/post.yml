name: dang-tin
on:
  repository_dispatch:
    types: [dang_tin]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Chỉ dựng video xem thử, không đăng (true/false)'
        default: 'true'
      force:
        description: 'Ép đăng dù vừa đăng cách đây dưới 40 phút (true/false)'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: dang-tin
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: reel/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji
      - run: pip install -r reel/requirements.txt
      - name: Dựng video và đăng
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          IN_PREVIEW: ${{ github.event.inputs.preview }}
          IN_FORCE: ${{ github.event.inputs.force }}
          FB_PAGE_TOKEN_SVMN: ${{ secrets.FB_PAGE_TOKEN_SVMN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          WORK_DIR: /tmp/svmn
        run: python reel/make.py
      - name: Lưu video xem thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-xem-thu
          path: |
            /tmp/svmn/final.mp4
            /tmp/svmn/caption.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Lưu trạng thái
        if: always()
        run: |
          git config user.name "tuongspithue"
          git config user.email "tuongspithue@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then git commit -m "cập nhật trạng thái tin" && git pull --rebase -q && git push; fi
